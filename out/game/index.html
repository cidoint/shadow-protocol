<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shadow Protocol</title>
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0;
      height: 100%;
      background: #0b0e14;
      overflow: hidden;
    }
    #game {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <p id="status" role="status" aria-live="polite" class="visually-hidden"></p>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
